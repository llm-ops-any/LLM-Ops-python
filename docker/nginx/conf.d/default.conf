server {
    # 先用 IP + HTTP 跑通：直接监听 80，不再强制跳转 HTTPS
    listen 80;
    server_name _;

    # 允许上传较大的文件（知识库文档 / 图片）
    client_max_body_size 15M;

    # 将 /api/ 的请求代理到 llmops-api 服务的 5001 端口
    location /api/ {
        proxy_pass http://llmops-api:5001;
        # 修复路径，避免 /api 后面的路径丢失
        rewrite ^/api/(.*)$ /$1 break;
        include proxy.conf;
    }

    # 其余请求转发到 llmops-ui 服务的 3000 端口
    location / {
        proxy_pass http://llmops-ui:3000;
        include proxy.conf;
    }
}
