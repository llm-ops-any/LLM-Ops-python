model: deepseek-v4-pro
label: deepseek-v4-pro
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 131072
max_output_tokens: 8192
attributes:
  model: deepseek-v4-pro
  # 关闭思考模式：该平台deepseek系列默认开启思考模式，要求把reasoning_content原样回传，
  # 而LangChain的流式响应不保留该字段(实测恒为空)，导致工具调用第二轮随机报400
  # "The reasoning_content in the thinking mode must be passed back to the API"。
  # 注：qwen系列无此问题，故不加该参数。
  extra_body:
    thinking:
      type: disabled
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    default: 0.85
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
metadata:
  pricing:
    input: 0.002
    output: 0.008
    unit: 0.001
    currency: RMB
