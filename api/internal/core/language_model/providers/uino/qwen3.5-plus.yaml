model: qwen3.5-plus
label: qwen3.5-plus
model_type: chat
features:
  - tool_call
context_window: 131072  # 推定值：平台未提供该模型的上下文规格
max_output_tokens: 8192  # 推定值：平台未提供该模型的输出上限
attributes:
  model: qwen3.5-plus
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    default: 0.85
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
metadata:
  # 价格：平台未提供各模型的计费单价，暂填0，待有权威价格后补齐
  pricing:
    input: 0
    output: 0
    unit: 0.001
    currency: RMB
